evaluations:
  - id: native-slop-flutter-counterexample
    unit_id: native-slop-tells
    kind: counterexample
    description: A Flutter polish request must use the stack-neutral Native App Tells table and must not run Expo grep recipes.
    must_fail:
      - React Native grep recipes
    must_pass:
      - stack-neutral wording
  - id: four-state-counterexample
    unit_id: four-state-screens
    kind: counterexample
    description: Empty is not first-load, and a form stays until save succeeds.
    must_fail:
      - Never show the empty state while the first load is still resolving
      - Do not dismiss a form
    must_pass:
      - Keep showing known content while a refresh runs
  - id: motion-review-counterexample
    unit_id: motion-review-standards
    kind: counterexample
    description: Motion review uses token-scale gaps, not CSS millisecond defaults.
    must_fail:
      - ad-hoc millisecond values
    must_pass:
      - origin-aware and never starts from zero
  - id: momentum-projection-counterexample
    unit_id: momentum-projection
    kind: counterexample
    description: A flick settles from the projected rest position, not the release point alone.
    must_fail:
      - snap to the nearest rest point from the release position
    must_pass:
      - Project the resting position from release velocity
  - id: worst-case-data-counterexample
    unit_id: worst-case-data
    kind: counterexample
    description: Worst-case data is a review method, not a shipped demo toggle.
    must_fail:
      - demo-data toggle
    must_pass:
      - long names and one-letter names
