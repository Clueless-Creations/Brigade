# Spec pack manifest. One file. Every screen, state, web page, event and
# acceptance rule the build must meet. Gate 1 approves this file plus the
# rendered index.html. After approval, workers build to it without questions.
#
# Example app below is a PLACEHOLDER ("Soon", a countdown app). Replace it.

schema_version: 1

meta:
  name: Soon (example)
  slug: soon-example
  web_origin: "https://<slug>.<account>.workers.dev" # host free URL; the site reads this one value
  # domain is optional. Omit it until a binary needs the host. It does not block the site.
  spec_version: 0.1.0
  status: draft            # draft | approved | superseded
  approved_by: null        # filled at Gate 1
  approved_at: null
  platforms: [ios]
  stack: swiftui           # swiftui | flutter | expo  (see plan: stack choice)
  promise: Count down to the dates that matter, on your Home and Lock Screen.
  audience: People planning a trip, a wedding, a birthday or a launch.
  core_loop: Add a date -> see days left at a glance -> get nudged before it.
  definition_of_good: >-
    D1 retention >= 35%. 7-day paywall view-to-purchase >= 4%.
    Crash-free sessions >= 99.5%.
  kill_criteria: Fewer than 300 installs in the first 30 days with paid UA under $200.

research:
  question: What makes people pay for a countdown app?
  comps:
    - name: Example comp A (category leader)
      store_id: "000000000"
      observed: "One-time widget unlock. Home, Lock Screen and StandBy widgets are premium."
    - name: Example comp B
      store_id: "000000000"
      observed: "Placeholder: not inspected yet. Research step fills this."
  patterns_we_copy: [first event in under 30 s, widget is the paid hook, one-time unlock]
  patterns_we_reject: [ads on free tier, account required before value]

design:
  style_prompt: >-
    Flat vector illustration, soft grain, warm paper background, one bold accent
    color, rounded geometric shapes, no gradients, no text in images, centered
    subject with generous margin.
  icons: SF Symbols only
  tokens:
    color:
      light: { bg: "#FBF7F0", surface: "#FFFFFF", text: "#1D1B18", muted: "#6E675E", primary: "#FF5A36", accent: "#2E6BFF", danger: "#C62828" }
      dark:  { bg: "#14120F", surface: "#1F1C18", text: "#F5F1EA", muted: "#A39B90", primary: "#FF7A5C", accent: "#6C95FF", danger: "#EF5350" }
    type:
      family: SF Pro Rounded
      scale: { caption: 12, body: 16, title3: 20, title1: 28, display: 48 }
    spacing: [4, 8, 12, 16, 24, 32]
    radius: { sm: 8, md: 14, lg: 22 }
    motion: { spring: "response 0.35, damping 0.8", reduce_motion: crossfade 150ms }

onboarding:
  archetype: utility-quick-start
  reason: A countdown should show the first date in under 30 seconds. A quiz would delay that.
  first_value_target_s: 30
  steps:
    - { id: welcome, screen: welcome, kind: value }
    - { id: add-event, screen: add-event, kind: value }
  paywall:
    type: one-time
    placement: after-first-value
    closing_offer: "no"
  review_prompt:
    type: none
    reason: The first run does not ask for a rating.
  steps_not_used:
    - { id: quiz, reason: A quiz delays the first date on a utility. }
    - { id: symptom-screens, reason: This archetype does not ask the user to list problems. }
    - { id: feature-tour, reason: A multi-screen feature tour is a listed failure mode. }
    - { id: custom-rating, reason: A custom rating ask breaks Guideline 5.6.1. }
    - { id: plan-loader, reason: There is no generated plan to compute. }
    - { id: closing-offer, reason: The example sells a one-time unlock and has no discount offer. }

mascot:
  use: "no"
  reason: The countdown is the product. A character is a separate paid animation choice.



# Every app screen. Each screen lists the states it must render. Allowed
# states: default, loading, empty, error, offline, permission-denied, success.
# A state left out must be listed in not_applicable with a reason.
# mock: simple blocks the renderer turns into a phone mock. A block with
# "to" is a tap target in the click-through prototype.
screens:
  - id: welcome
    flow: onboarding
    title: Welcome
    purpose: Show the promise and start the first countdown in one tap.
    states: [default]
    not_applicable: { loading: static screen, empty: static screen, error: no I/O }
    mock:
      default:
        - { type: art, label: "Hero art: calendar page flying off (style prompt)" }
        - { type: title, text: "Count down to what matters" }
        - { type: text, text: "Days left, right on your Home Screen." }
        - { type: button, text: "Add my first date", to: add-event }
    events: [onboarding_started, onboarding_step_viewed]
    acceptance:
      - Primary button visible without scrolling on iPhone SE (3rd gen).
      - No sign-in before first value.

  - id: add-event
    flow: onboarding
    title: Add event
    purpose: Capture title, date and an emoji. First value in under 30 seconds.
    states: [default, error]
    not_applicable: { loading: local save, empty: form starts blank by design }
    mock:
      default:
        - { type: nav, text: "New countdown" }
        - { type: input, label: "Title", value: "Lisbon trip" }
        - { type: input, label: "Date", value: "Mar 14, 2027" }
        - { type: chips, items: ["✈️", "🎂", "💍", "🚀", "🎄"] }
        - { type: button, text: "Save", to: home }
      error:
        - { type: nav, text: "New countdown" }
        - { type: input, label: "Title", value: "" , error: "Add a title" }
        - { type: input, label: "Date", value: "Mar 14, 2027" }
        - { type: button, text: "Save", disabled: true }
    events: [onboarding_step_viewed, onboarding_completed, core_action_completed]
    acceptance:
      - Save with empty title shows inline error, no alert.
      - Past dates are allowed and show "days since".

  - id: home
    flow: core
    title: Home
    purpose: List countdowns, nearest first.
    states: [default, empty]
    not_applicable: { loading: local store reads under 50 ms, error: local only }
    mock:
      default:
        - { type: nav, text: "Soon", action: "+", action_to: add-event }
        - { type: countdown, title: "Lisbon trip", emoji: "✈️", days: 158, to: event-detail }
        - { type: countdown, title: "Mia's birthday", emoji: "🎂", days: 41 }
        - { type: countdown, title: "App launch", emoji: "🚀", days: 12 }
        - { type: button, text: "Add a widget", style: secondary, to: paywall }
        - { type: link, text: "Settings", to: settings }
      empty:
        - { type: nav, text: "Soon", action: "+", action_to: add-event }
        - { type: art, label: "Empty art: blank calendar page (style prompt)" }
        - { type: title, text: "Nothing to count yet" }
        - { type: button, text: "Add a date", to: add-event }
    events: [app_opened, $screen]
    acceptance:
      - Sorted nearest first; past events in a separate "Since" section.
      - Large text (AX5) keeps titles readable with no truncation of day count.

  - id: event-detail
    flow: core
    title: Event detail
    purpose: Big number, share, edit, reminder settings.
    states: [default]
    not_applicable: { loading: local, empty: always has an event, error: local }
    mock:
      default:
        - { type: nav, text: "Lisbon trip", back: home }
        - { type: big, text: "158", caption: "days to go" }
        - { type: row, label: "Remind me", value: "1 day before" }
        - { type: row, label: "Repeat", value: "Never" }
        - { type: button, text: "Share", style: secondary }
    events: [core_action_completed]
    acceptance:
      - Number updates at local midnight without relaunch.

  - id: paywall
    flow: monetization
    title: Paywall
    purpose: Sell the widget unlock after the first event exists.
    states: [default, loading, error, success]
    not_applicable: { empty: offer always present }
    mock:
      default:
        - { type: close, to: home }
        - { type: art, label: "Widget preview on Home Screen" }
        - { type: title, text: "Put it on your Home Screen" }
        - { type: bullets, items: ["Home and Lock Screen widgets", "StandBy view", "Unlimited themes"] }
        - { type: price, text: "$4.99 once", caption: "No subscription" }
        - { type: button, text: "Unlock", to: home }
        - { type: link, text: "Restore purchase" }
      loading:
        - { type: close }
        - { type: spinner, text: "Loading price…" }
      error:
        - { type: close, to: home }
        - { type: banner, text: "Store unavailable. Try again." }
        - { type: button, text: "Retry" }
      success:
        - { type: art, label: "Confetti, reduced-motion safe" }
        - { type: title, text: "Unlocked" }
        - { type: button, text: "Add widget", to: home }
    events: [paywall_viewed, purchase_started, purchase_completed]
    acceptance:
      - Price comes from RevenueCat offering, never hard-coded.
      - Restore works on a fresh install with the sandbox account.

  - id: settings
    flow: core
    title: Settings
    purpose: Restore, support, privacy, terms, delete data.
    states: [default]
    not_applicable: { loading: static, empty: static, error: static }
    mock:
      default:
        - { type: nav, text: "Settings", back: home }
        - { type: row, label: "Restore purchase" }
        - { type: row, label: "Contact support" }
        - { type: row, label: "Privacy" }
        - { type: row, label: "Delete all data", danger: true }
    events: [$screen]
    acceptance:
      - Every link opens the matching web surface below.

# Web surfaces. Required for store review and trust.
# Each page carries title, description, and an optional og_image override.
web:
  - id: landing
    path: /
    title: Landing
    description: Count down to the dates that matter, on your Home and Lock Screen.
    og_image: web/og/landing.png
    sections: [hero with App Store badge, three feature rows, widget gallery, FAQ, footer links]
    acceptance:
      - Lighthouse performance >= 90 on mobile
      - App Store link uses the real app ID after Gate 2
      - Reduced-motion check passes.
      - Content stays readable without JavaScript.
      - npx impeccable detect reports zero high findings.
      - The geo-seo.md section 4 copy scan is recorded in the pull request.
  - id: privacy
    path: /privacy
    title: Privacy policy
    description: What Soon stores, which processors it uses, and how to ask a question.
    sections: [data collected, "processors: RevenueCat, PostHog, Sentry", retention, contact]
    acceptance: [Matches App Privacy labels exactly]
  - id: terms
    path: /terms
    title: Terms of use
    description: The license, Apple purchases and refunds, and the liability terms.
    sections: [license, purchases and refunds via Apple, liability]
    acceptance: [Linked from paywall and settings]
  - id: support
    path: /support
    title: Support
    description: How to restore a purchase and how to contact support.
    sections: [FAQ, contact email, restore steps]
    acceptance: ["Returns 200, not a GitHub link"]
  - id: delete
    path: /delete-account
    title: Data deletion
    description: What deletion removes, the in-app path, and the email fallback.
    sections: [what is deleted, how to delete in app, email fallback]
    acceptance: [Meets App Store 5.1.1(v) when accounts exist]

# Social cards for every web page. Per-page og_image overrides web_meta.og_image.
web_meta:
  site_name: Soon
  title_pattern: "{page} · Soon"
  default_description: Count down to the dates that matter, on your Home and Lock Screen.
  og_image: web/og/default.png
  og_image_width: 1200
  og_image_height: 630
  theme_color: "#FF5A36"
  x_card: summary_large_image

# SEO, AEO, and GEO plumbing. canonical_origin is optional.
# This example leaves it unset, so the check uses meta.web_origin.
discovery:
  sitemap_routes: [/, /privacy, /terms, /support, /delete-account]
  llms_txt:
    - Soon counts down to a date you choose.
    - The countdown is on the Home Screen and the Lock Screen.
    - Privacy, terms, support, and data deletion each have a public page.
  json_ld_types: [Organization, WebSite, MobileApplication, FAQPage]
  faq:
    - question: What does Soon do?
      answer: Soon shows the days left until a date you choose, on the Home Screen and the Lock Screen.
    - question: Does Soon require an account?
      answer: You can save a countdown on the device before you create an account.

# Channels from a web visit to the App Store. The CTA is a static href.
funnel:
  smart_app_banner:
    meta_name: apple-itunes-app
    app_id: "0000000000"
    app_argument: "https://<slug>.<account>.workers.dev/"
  store:
    app_id: "0000000000"
    pt: "<provider-token>"
    mt: 8
  channels:
    - id: organic
      landing_path: /
      ct: organic
      fallback: static_href
    - id: share
      landing_path: /
      ct: share
      fallback: static_href

# Universal links. Each path names a screen and a web page that exists above.
deep_links:
  aasa: /.well-known/apple-app-site-association
  routes:
    - path: /event/*
      screen: event-detail
      web_fallback: /
    - path: /settings
      screen: settings
      web_fallback: /support
  test_matrix: [installed, not_installed, in_app_browser]

store:
  name: "Soon: Countdown Widget"
  subtitle: Days left on your Home Screen
  keywords: [countdown, widget, days until, event, trip, birthday, wedding]
  category: Utilities
  age_rating: 4+
  screenshots:
    - { screen: home, caption: "Every date that matters" }
    - { screen: paywall, caption: "On your Home and Lock Screen" }
    - { screen: event-detail, caption: "Big, clear, shareable" }
  creative_assets:
    - id: product-page-header
      placement: product-page header
      media: image or video
      source_provider: provider.higgsfield
      spec: https://developer.apple.com/help/app-store-connect/reference/app-information/creative-assets-specifications
    - id: search-result
      placement: search results
      media: image or video
      source_provider: provider.higgsfield
      spec: https://developer.apple.com/help/app-store-connect/reference/app-information/creative-assets-specifications
    - id: seasonal-set
      placement: seasonal set
      media: image or video
      source_provider: provider.higgsfield
      spec: https://developer.apple.com/help/app-store-connect/reference/app-information/creative-assets-specifications
  pricing:
    model: one-time unlock
    price: $4.99
    revenuecat: { entitlement: pro, offering: default, product: soon_pro_lifetime }
  paywall_offer: Shown after first event saved and on widget tap. Never on first launch.

# Accounts. mode: none | optional | required.
# A third-party login needs sign_in_with_apple or equivalent_private_login.
# mode other than none also needs web id "delete" and in_app_delete_screen.
accounts:
  mode: none

# Data inventory. Each row is one App Privacy label decision.
privacy:
  tracking: false
  inventory:
    - data: Product interaction
      purpose: Which screens people open
      app_privacy_label: Product Interaction
      linked_to_identity: false
      used_for_tracking: false
      processor: PostHog
      retention: 12 months
    - data: Purchase history
      purpose: Remember the paid widget unlock
      app_privacy_label: Purchases
      linked_to_identity: false
      used_for_tracking: false
      processor: RevenueCat
      retention: Kept while the purchase record exists
    - data: Crash data
      purpose: Find and fix crashes
      app_privacy_label: Crash Data
      linked_to_identity: false
      used_for_tracking: false
      processor: Sentry
      retention: 90 days
  required_reason_apis:
    - api: UserDefaults
      reason: CA92.1

# Entitlements, where secrets live, and how deep links are checked.
security:
  entitlements: []
  secrets: ".env.example lists names only. Values stay in the host secret store."
  deep_links: Reject every URL whose host or path is outside the app allow-list.

# Pre-ship legal check. Not legal advice. Do not invent a mailing address or a price.
# status: pass | fix | n/a | founder_fact_needed
# n/a needs reason. DMCA and email-provider items need human_steps unless n/a.
legal_preflight:
  - id: coppa
    status: founder_fact_needed
    where: store.age_rating
    human_steps: Confirm whether the app is directed to children under 13. A 4+ age rating is not that decision. If it is, block signup without verifiable parental consent.
  - id: fonts
    status: pass
    where: web/
    reason: Web pages use font files shipped with the site. No third-party font CDN.
  - id: session_replay
    status: pass
    where: analytics
    reason: PostHog session replay stays off. If it is turned on later, ask for consent and mask inputs.
  - id: can_spam
    status: founder_fact_needed
    where: email provider settings
    human_steps: Every marketing email needs an unsubscribe link and the founder's postal address. Do not invent the address.
  - id: auto_renew
    status: n/a
    where: store.pricing
    reason: The price is a one-time unlock, not an automatic renewal.
  - id: dmca
    status: n/a
    where: No upload surface
    reason: The app does not accept user uploads, so no DMCA designated agent is required.
    human_steps: An app that accepts uploads registers a designated agent with the US Copyright Office. Read the current fee before paying. The registration is a human step.

analytics:
  provider: posthog
  common_props: [app_id, platform, app_version, build_number]
  events:
    - { name: app_opened, when: App foreground, props: [] }
    - { name: onboarding_started, when: First onboarding screen shown, props: [step_id] }
    - { name: onboarding_step_viewed, when: An onboarding step is shown, props: [step_id] }
    - { name: onboarding_completed, when: First countdown is saved, props: [step_id] }
    - { name: core_action_completed, when: Event saved or shared, props: [feature_key] }
    - { name: paywall_viewed, when: Paywall shown, props: [source] }
    - { name: purchase_started, when: Unlock tapped, props: [product_id] }
    - { name: purchase_completed, when: Entitlement active, props: [product_id, price] }
    - { name: $screen, when: Every screen view, props: [screen_id] }

# Optional tasks. Screens become S-<id> (area App) and web pages become W-<id> (area Web).
# capabilities: Auth, Privacy, Security, Deep links, Discovery (SEO/AEO/GEO), Analytics, Accessibility.
# milestone: Build, Dogfood, Gate 2, Launch, or Run. Omitted tasks start on Build.
# W-DISCOVERY has no dependencies, so it runs beside the first web page.
# W-POLISH runs after W-landing and loads the polish references in this order.
tasks:
  - id: W-DISCOVERY
    title: SEO, AEO, and GEO plumbing
    area: Web
    depends_on: []
    acceptance:
      - curl robots.txt, sitemap.xml, and llms.txt on the canonical origin. Each returns HTTP 200.
      - JSON-LD on the public pages parses.
    capabilities: []
  - id: W-POLISH
    title: Web polish pass
    area: Web
    depends_on: [W-landing]
    acceptance:
      - Load knowledge/design/landing-motion-craft.md.
      - Load catalog/upstreams/amir-cinematic-scroll.yaml.
      - Load review-animations and improve-animations from knowledge/engineering/external-skill-packs.md.
      - Load knowledge/design/design-visual-system.md.
      - Load knowledge/design/vibecoded-tells.md.
      - Load knowledge/design/consumer-craft-benchmarks.md.
      - Load taste-skill and impeccable. Run npx impeccable detect with zero high findings.
      - Load knowledge/words/conversion-copy.md.
      - Load knowledge/words/no-slop-writing.md.
      - Load knowledge/words/consumer-copy-benchmarks.md.
      - Record the knowledge/growth/geo-seo.md section 4 copy scan in the pull request.
    capabilities: []

repo:
  files:
    - { path: AGENTS.md, purpose: "Short worker guide: read spec.yaml, build one screen, compare to mock, run gate." }
    - { path: spec/spec.yaml, purpose: "This manifest (approved copy)." }
    - { path: spec/index.html, purpose: "Rendered spec pack." }
    - { path: DESIGN.md, purpose: "Tokens and style prompt, same values as design.tokens." }
    - { path: TASKS.md, purpose: "Generated from screens, web pages, and tasks. W-DISCOVERY has no dependencies. W-POLISH runs after W-landing and loads landing-motion-craft.md, then the visual references, then the copy references." }
    - { path: scripts/merge-gate.sh, purpose: "Build, unit tests, screenshot-vs-mock check, lint, and the snapshot record-mode step." }
    - { path: .env.example, purpose: "Names only, no values." }
    - { path: web/, purpose: "Landing and policy pages. Each page head carries title, description, canonical, Open Graph, an X card, a favicon, and theme-color. The og:image is a 1200 by 630 PNG or JPG with an absolute URL." }
  merge_gate:
    - Build succeeds for every platform in meta.platforms.
    - Unit tests pass.
    - Each changed screen has a simulator screenshot per required state.
    - Screenshot-vs-mock review recorded with any differences fixed or listed.
    - No hard-coded colors, sizes or strings outside tokens and copy files.
    - No snapshot test is in record mode.

gates:
  gate_1:
    name: Spec approval
    owner: founder
    approves: [screens and states, web surfaces, tokens and style prompt, store listing and price, event map]
  gate_2:
    name: Store submission
    owner: founder
    approves: [real-device dogfood verdict, final screenshots, price in App Store Connect, review notes]

# Later blocks go here: hypotheses, ledger.

approval_checklist:
  - Every screen has every required state, or a reason it does not.
  - Every tap target leads somewhere in the prototype.
  - Paywall price and offer match store.pricing.
  - All five web surfaces exist and are linked from settings.
  - Event map covers install -> onboard -> core -> paywall -> paid.
  - Style prompt and tokens are final; no new colors after approval.
  - Definition of good and kill criteria are set.
  - Value in 3 seconds. The first screen's default mock shows the core value, and it does not ask for sign-up.
  - The name and icon decide the invite.
  - Marketing and product are one thing. The ad, the store page, onboarding, and the invite use the same audience and the same promise.
  - Product-market fit is binary. If it is unclear, it is not working, so cut or pivot at Gate 2.
  - Live support chat is in the app in the early days.
