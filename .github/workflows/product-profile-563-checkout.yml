name: Product Profile 563 checkout

on:
  push:
    branches: [work/product-profile-563-contract]

permissions:
  contents: read

jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Prepare scoped verification checkout
        run: |
          mkdir -p "$RUNNER_TEMP/product-profile-review"
          git bundle create "$RUNNER_TEMP/product-profile-review/repository.bundle" --all
          git archive HEAD | gzip > "$RUNNER_TEMP/product-profile-review/source.tar.gz"
          tar -czf "$RUNNER_TEMP/product-profile-review/dependencies.tar.gz" node_modules
          cp "$(command -v node)" "$RUNNER_TEMP/product-profile-review/node"
          git rev-parse HEAD > "$RUNNER_TEMP/product-profile-review/revision.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: product-profile-563-review-checkout
          path: ${{ runner.temp }}/product-profile-review/
          retention-days: 1
          if-no-files-found: error
