name: Stamp

# Disabled by default. workflow_dispatch only. This file does not run on push.
#
# A push to main cannot update main by itself. The ruleset requires a pull
# request and has no bypass actors. This job opens or updates one pull request
# on release/stamp-next.
#
# Turning this on for every push to main needs a founder settings change:
# allow GitHub Actions to create and approve pull requests. Do not add a push
# trigger, and do not change the ruleset, until that setting exists.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  stamp:
    name: Stamp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Stamp main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release:stamp -- --push --branch release/stamp-next

      - name: Open or update the stamp pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin release/stamp-next || true
          if ! git rev-parse --verify --quiet origin/release/stamp-next >/dev/null; then
            echo "No stamp commit. Nothing to open."
            exit 0
          fi
          existing="$(gh pr list --head release/stamp-next --base main --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Updated pull request #$existing"
            exit 0
          fi
          gh pr create --base main --head release/stamp-next --title "Stamp next" --body "Release stamp for commits on main since the last stamp. Generated by the stamp workflow."
