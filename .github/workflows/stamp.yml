name: Stamp

# A push to main opens or updates one release/stamp-<version> pull request.
# workflow_dispatch runs the same job.
#
# Skip a stamp push so the merge cannot start another stamp. A squash subject
# starts with "Stamp ". A merge commit subject names the release/stamp-* branch.
# The concurrency group queues overlapping pushes. A later run updates the open
# stamp pull request instead of opening a second one.
#
# A pull request opened with GITHUB_TOKEN does not start pull_request workflows.
# workflow_dispatch does start a run with that token. This job dispatches CI on
# the stamp branch with verification=presubmit.
#
# Squash auto-merge needs the repository setting Allow auto-merge. This file
# does not change the ruleset.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stamp-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  stamp:
    name: Stamp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Squash stamps start with "Stamp ". Dispatch has no head commit.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Stamp ')
    steps:
      - name: Skip a release/stamp merge commit
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          case "$subject" in
            *"release/stamp-"*)
              echo "Stamp merge. Skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout main
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Stamp main and open or update the pull request
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          existing="$(gh pr list --base main --state open --limit 100 --json number,headRefName --jq '[.[] | select(.headRefName | startswith("release/stamp-"))] | sort_by(.number) | .[0] // empty')"
          branch=""
          number=""
          if [ -n "$existing" ]; then
            branch="$(jq -r '.headRefName' <<<"$existing")"
            number="$(jq -r '.number' <<<"$existing")"
            git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            npm run release:stamp -- --push --branch "$branch"
          else
            npm run release:stamp -- --push
          fi

          head="$(git rev-parse --abbrev-ref HEAD)"
          case "$head" in
            release/stamp-*) ;;
            *)
              echo "No stamp commit. Nothing to open."
              exit 0
              ;;
          esac

          version="$(node -p 'require("./skill-version.json").version')"
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          Release stamp ${version}.

          This pull request bumps the patch, writes release notes from merged subjects, and regenerates the stamp files.

          CI is dispatched on this branch. A pull request opened with the default token does not start pull_request workflows. workflow_dispatch does.
          EOF

          title="Stamp ${version}"
          if [ -z "$number" ]; then
            url="$(gh pr create --base main --head "$head" --title "$title" --body-file "$body_file")"
            number="${url##*/}"
          else
            gh pr edit "$number" --title "$title" --body-file "$body_file"
          fi

          gh workflow run ci.yml --ref "$head" -f verification=presubmit

          merge_err="$(mktemp)"
          if gh pr merge "$number" --auto --squash 2>"$merge_err"; then
            echo "Auto-merge enabled for #${number}."
          else
            cat "$merge_err" >&2
            enabled="$(gh pr view "$number" --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // empty')"
            if [ -n "$enabled" ]; then
              echo "Auto-merge already enabled for #${number}."
            else
              echo "Auto-merge was not enabled. Turn on Allow auto-merge in the repository settings."
              exit 1
            fi
          fi
