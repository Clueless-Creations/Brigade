name: Product Profile contract

# Additional contract fixtures, not a replacement for the repository CI lanes.
on:
  pull_request:
    paths:
      - docs/contracts/product-profile/**
      - docs/decisions/0019-product-profile-truth-ownership.md
      - contracts/product-profile/**
      - kernel/services/intended-product-profile*
      - kernel/services/product-profile-query*
      - kernel/services/observed-product-profile*
      - kernel/services/product-profile-delta*
      - kernel/services/product-profile-lifecycle*
      - kernel/services/reference-product-profile*
      - .github/workflows/product-profile-contract.yml
  push:
    branches: [main]
    paths:
      - docs/contracts/product-profile/**
      - docs/decisions/0019-product-profile-truth-ownership.md
      - contracts/product-profile/**
      - kernel/services/intended-product-profile*
      - .github/workflows/product-profile-contract.yml

permissions:
  contents: read

jobs:
  conformance:
    name: Product Profile conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node --test docs/contracts/product-profile/contract.test.mjs
      - run: node --import tsx --test kernel/services/intended-product-profile.test.ts
      - run: node --import tsx --test kernel/services/product-profile-query.test.ts
      - run: node --import tsx --test kernel/services/observed-product-profile.test.ts
      - run: node --import tsx --test kernel/services/product-profile-delta.test.ts
      - run: node --import tsx --test kernel/services/product-profile-lifecycle.test.ts
      - run: node --import tsx --test kernel/services/reference-product-profile.test.ts
