name: Product Profile 563 verification

# Temporary branch-only verification. Removed before PR handoff.
on:
  push:
    branches: [work/product-profile-563-contract]
    paths:
      - .github/workflows/product-profile-563-apply.yml

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/work/product-profile-563-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      base: ${{ steps.commit.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify the complete patch before applying any change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re, subprocess
          root = Path('docs/contracts/product-profile/.transfer')
          expected = ['5cd4ceeb9df4c4b87d5c713fca846229e078dcdf', 'ec3e6b9c4687c512cbb506e6b5d064d53aa417b3', '757d0544cfa0d421a1d413fa4ea0ffc0fc005773', '43545e3e2fd33b8bd0ed20fc5903d98250a0d264']
          parts = []
          for i, want in enumerate(expected, 1):
              value = (root / f'patch-{i}.b64').read_text().strip()
              value = re.sub(r'<(\d+):([A-Za-z0-9+/]+)>', lambda m: m[2] * int(m[1]), value)
              if i == 2:
                  value = value.replace('C2D+D44gtvLtDfO7fcuZ6F8PCZHhTC7', 'C2D+D44gtvLtDfO7fXxhDyAqEL00ToIltFywVjzgFh8RQYmfFVsHRqgG0hTeFBMDf6Wwbe6OWnb3mRs2ixbzs56P4IAs9+q906eHc5emi6YrDAalD5A5Th77iOFscrtWRcC5nR20/fcuZ6F8PCZHhTC7')
              data = value.encode()
              got = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              print(f'part {i}: {len(data)} bytes; {got}; expected {want}', flush=True)
              assert got == want, f'transfer part {i} mismatch; no patch applied'
              parts.append(value)
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b64f31485da2364eed47280a922285a5ebbea0ed9178de95fe27c64d9c068c77', 'complete patch mismatch'
          Path('/tmp/product-profile-563.patch').write_bytes(patch)
          allowed = {
              '.github/workflows/product-profile-contract.yml', 'docs/architecture.md',
              'docs/contracts/product-profile/README.md', 'docs/contracts/product-profile/conformance.mjs',
              'docs/contracts/product-profile/contract.test.mjs', 'docs/contracts/product-profile/product-profile.v1.schema.json',
              'docs/contracts/product-profile/examples/intended.json', 'docs/contracts/product-profile/examples/observed.json',
              'docs/contracts/product-profile/examples/observed-reference.json', 'docs/decision-driven-building.md',
              'docs/decisions/0019-product-profile-truth-ownership.md', 'docs/decisions/README.md',
              'docs/north-star-architecture.md', 'docs/plans/2026-09-20-decision-driven-building.md',
          }
          paths = {line.split('\t')[2] for line in subprocess.check_output(['git', 'apply', '--numstat', '/tmp/product-profile-563.patch'], text=True).splitlines()}
          assert paths == allowed, paths ^ allowed
          print('Checksum and exact #563 path allowlist verified.')
          PY
      - name: Rebase the isolated lane and apply only its contract files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rev-parse HEAD > /tmp/product-profile-563-start
          git fetch origin main
          git rebase origin/main
          # Workflow writes are handled by the connector, not by this job token.
          git apply --3way --index --exclude=.github/workflows/product-profile-contract.yml /tmp/product-profile-563.patch
          git rm -r docs/contracts/product-profile/.transfer
          git diff --cached --check
      - run: npm ci
      - run: node --test docs/contracts/product-profile/contract.test.mjs
      - run: npm run audit:ci -- --lane presubmit
      - name: Commit the verified slice on its own branch
        id: commit
        run: |
          git commit -m 'feat(architecture): define Product Profile v1 contract (#563)'
          git push --force-with-lease=refs/heads/work/product-profile-563-contract:$(cat /tmp/product-profile-563-start) origin HEAD:refs/heads/work/product-profile-563-contract
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          git diff --stat origin/main...HEAD
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: product-profile-563-transfer-diagnostics
          path: docs/contracts/product-profile/.transfer/
          include-hidden-files: true
          retention-days: 1

  audit:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run audit:ci 2>&1 | tee /tmp/pp563-full-audit.log
      - name: Compare untouched main source freshness
        if: always()
        run: |
          git worktree add --detach /tmp/pp563-baseline '${{ needs.apply.outputs.base }}'
          ln -s "$PWD/node_modules" /tmp/pp563-baseline/node_modules
          npm --prefix /tmp/pp563-baseline run check:source-freshness 2>&1 | tee /tmp/pp563-baseline-freshness.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-profile-563-audit-receipts
          path: /tmp/pp563-*.log
          retention-days: 3

  hosted:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix hosted/knowledge-mcp
      - run: npm run hosted:check

  app:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix hosted/builder-console
      - run: npm run app:check
