name: Profile 565 regen
on:
  push:
    branches: [work/product-profile-565-observed]
    paths: [.github/workflows/profile-565-regen.yml]
permissions: { contents: write }
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: |
          npm run render:all
          npm run render:evidence-schema-version
          npm run hosted:bundle
          npm run check:version-discipline
          npm run check:catalog
          npm run check:hosted-bundle
      - run: |
          rm .github/workflows/profile-565-regen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(profile): regenerate 0.221.68 projections"
          git push origin HEAD:work/product-profile-565-observed
