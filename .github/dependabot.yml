version: 2

# A bump that changes a generator (wrangler writes worker-configuration.d.ts)
# is regenerated by .github/workflows/dependency-regen.yml from the list in
# tooling/generated-artifacts.json. When that fails, add an ignore rule here and
# track the upgrade in the weekly upstream-freshness issue. See CONTRIBUTING.md,
# "Dependency bumps with generated files".

updates:
  # Root, hosted knowledge MCP, and builder console share one npm update
  # entry so @modelcontextprotocol/sdk and zod move together. The knowledge
  # worker imports kernel modules that resolve the root install; separate
  # bumps fail the hosted typecheck.
  - package-ecosystem: npm
    directories:
      - /
      - /hosted/knowledge-mcp
      - /hosted/builder-console
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # patterns (not group-by: dependency-name) keeps both packages in one
      # pull request. group-by: dependency-name would open one pull request
      # per package name across these directories.
      mcp-sdk-and-zod:
        patterns:
          - "@modelcontextprotocol/sdk"
          - "zod"
      dev-dependencies:
        dependency-type: development
