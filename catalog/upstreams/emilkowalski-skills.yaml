      title: Selected motion-review, projection, and worst-case-data methods
      keywords:
        - motion
        - animation
        - worst-case
      owners: *emil-craft
  unsupported_operations:
    - id: automatic-install-or-upgrade
      reason: Requires explicit target, selected compatible revision, scoped authority and independent
        verification. No host installation, business repin or publication is automatic.
    - id: whole-pack-default
      reason: The full pack is not a catalog provider. Web skills never apply to a mobile binary. ask-sonner,
        pick-ui-library, and prototype stay rejected.
    - id: css-easing-defaults
      reason: Do not import CSS cubic-bezier values or millisecond literals as Brigade motion defaults.
        Express values on the existing token scale.
  platforms: []
adaptations:
  - id: token-scale-not-ms
    description: Express adapted timing and spring rules on DesignTokens.Motion. Do not copy CSS easings or ms literals.
    owner: knowledge/design/premium-mobile-craft.md
    intentional: true
  - id: no-product-demo-toggle
    description: Worst-case data is a review method. Do not require a Demo data toggle in the shipped product UI.
    owner: knowledge/design/mobile-flow-craft.md
    intentional: true
  - id: animate-expo-not-expo-animation
    description: Route animate-expo as the Expo/RN producer. Expo's expo-animation is the same body under this notice.
    owner: knowledge/engineering/recommended-agent-skills.md
    intentional: true
  - id: not-required
    description: Citing adapted methods does not require installing the upstream skill.
    owner: knowledge/engineering/recommended-agent-skills.md
    intentional: true
