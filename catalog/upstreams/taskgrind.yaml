    intentional: true
  - id: app-quality-remains-owner
    description: engineering/APP_QUALITY.md stays the quality summary owner; no competing TaskGrind ledger.
    owner: knowledge/engineering/app-quality.md
    intentional: true
  - id: provider-neutral-assisted-path
    description: Assisted recruitment semantics live in kernel/services/human-beta-recruitment.ts without TaskGrind-native types.
    owner: kernel/services/human-beta-recruitment.ts
    intentional: true
