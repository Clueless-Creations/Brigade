      keywords: [operator-assisted, handoff, import, human-beta]
      owners: [kernel/services/human-beta-recruitment.ts, knowledge/engineering/human-beta-recruitment.md]
  unsupported_operations:
    - id: speculative-taskgrind-adapter
      reason: No authoritative native contract. Inventing endpoints/JSON/UI scrape is forbidden by #213.
    - id: live-taskgrind-account-or-terms
      reason: Creating/signing into accounts or accepting terms is not authorized by this issue.
    - id: live-recruit-spend-campaign
      reason: Contacting/paying testers, purchasing credits, or publishing campaigns needs separate authorization.
    - id: distribute-private-build-via-recruitment
      reason: Recruitment does not authorize TestFlight/Play/web distribution; those owners stay separate.
    - id: claim-live-human-beta-proof
      reason: Fixture/assisted success is not live human-beta proof without a separately authorized campaign.
    - id: vendor-global-taskgrind-flag
      reason: Selection must use existing product/recipe/binding mechanisms only.
