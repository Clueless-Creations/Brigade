    Qualification hold. Brigade may select TaskGrind as a managed-recruitment candidate through
    existing product/recipe/binding mechanisms and may prepare operator-assisted briefs/handoffs.
    No automated TaskGrind transport, live recruit, spend, or distribution authorization is supported.
  versions:
