authors:
  - name: Masko
    role: copyright holder named in the reviewed LICENSE
maintainers:
  - name: masko-ai (github.com/masko-ai)
    role: current upstream maintainer
copyright: Copyright (c) 2026 Masko
license:
  spdx: MIT
  status: verified
  evidence_url: https://github.com/masko-ai/masko-plugins/blob/9feb999e8e3bf609728261ab17bdcf63f0e811ff/LICENSE
  evidence_sha256: 1f51dd23802e97cd2714365efd914b2012cc0ca7b6ba1b0a11604dd0cf7bc340
  reviewed_revision: 9feb999e8e3bf609728261ab17bdcf63f0e811ff
