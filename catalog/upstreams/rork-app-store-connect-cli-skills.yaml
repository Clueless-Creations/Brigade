baselines:
  reviewed_source:
    revision: f52c4f04323bb2dfb21ca8be82e6494e9cd0b4d8
    observed_at: "2026-10-08"
    by: b2c-maintainers
    note: asc 5.13.0 README locks install-skills to this commit. Skill directory names match the 2026-09-05 list. No SKILL.md text was copied.
  reviewed_guidance:
    revision: unrecorded
    observed_at: "2026-10-08"
    by: b2c-maintainers
    note: asc 5.13.0 install-skills locks f52c4f04323bb2dfb21ca8be82e6494e9cd0b4d8. That commit is the reviewed source above. Guidance revision stays unrecorded. Repository main 9c7e769f09a18237c9bd9c70f70aef65f0cd0391 on 2026-10-05 is not adopted.
support:
  policy: Skill guidance is advice. It never marks a lane done, never overrides the builder's own reference on conflict, and loads only for the store workflows that name it. Guidance changes upstream are reviewed by mapped semantic comparison, not text merge.
  versions:
    - range: f52c4f04323bb2dfb21ca8be82e6494e9cd0b4d8
      status: untested
      evidence:
        - asc 5.13.0 README install-skills lock. Skill names only. No live skill execution.
  operations:
    - id: asc-cli-usage
      title: canonical commands, flags, output, pagination, auth
      keywords: [asc-cli-usage, cli usage]
    - id: asc-metadata-sync
      title: metadata/localization pull, validate, dry-run, apply
      keywords: [asc-metadata-sync, metadata]
    - id: asc-screenshot-resize
      title: current screenshot size matrix, alpha stripping, resize, validation
      keywords: [asc-screenshot-resize, screenshot]
    - id: asc-shots-pipeline
      title: simulator screenshot capture, framing, staged upload (koubou pinned upstream)
      keywords: [asc-shots-pipeline, shots, koubou]
    - id: asc-release-flow
      title: readiness, staging, validation, submission blockers
      keywords: [asc-release-flow, release]
    - id: asc-submission-health
      title: preflight, digital-goods readiness, review monitoring
      keywords: [asc-submission-health, submission]
    - id: asc-revenuecat-catalog-sync
      title: reconcile ASC products with RevenueCat
      keywords: [asc-revenuecat-catalog-sync, revenuecat]
    - id: asc-analytics-reports
      title: private analytics report discovery, download, integrity verification
      keywords: [asc-analytics-reports, analytics]
    - id: asc-ad-hoc-distribution
      title: experimental private iOS distribution with plan-hash approval
      keywords: [asc-ad-hoc-distribution, ad-hoc]
  unsupported_operations:
    - id: asc-wall-submit
      reason: Public submission to the Wall of Apps is a founder-approved public action; the builder never automates it.
  platforms: []
adaptations:
  - id: routed-by-name-only
    description: The builder names skills to load; it does not copy their instructions into the knowledge corpus.
    owner: knowledge/store/app-store-connect-cli.md
    intentional: true
  - id: builder-reference-wins
    description: Where a skill's guidance conflicts with knowledge/store/app-store-connect-cli.md, the builder reference wins.
    owner: knowledge/engineering/external-skill-packs.md
    intentional: true
