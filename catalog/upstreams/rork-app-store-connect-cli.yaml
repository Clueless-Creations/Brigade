relationships:
  - kind: external-executable
    consumption: The `asc` executable found on the host PATH runs App Store Connect reads, validation, dry runs, and founder-gated store actions. It is not package-managed by the builder and no workspace pin freezes it.
    local_owners:
      - adapters/app-review/asc-provider.ts
      - adapters/app-review/capability.ts
      - adapters/app-review/mandate.ts
      - adapters/app-review/types.ts
      - catalog/providers/apple-asc.yaml
    tests:
      - checks/validation/business/store/check-asc-command-contract.ts
      - checks/validation/repository/fixtures/agent-operations.fixtures.ts
      - checks/validation/repository/evals/launchbench/asc-flag-drift-runtime.yaml
      - checks/validation/repository/evals/launchbench/asc-stale-command-guidance.yaml
    upstream_paths:
      - README.md
      - LICENSE
      - releases
    pin_authority: PATH lookup at execution time (`which asc`); recorded as a host observation, never as a lock. Homebrew and the release binary can differ on one machine.
  - kind: adapted-method
    consumption: Command procedures, the auth ladder, safe automation boundaries, and the verified command cookbook are reauthored from the CLI README, local `asc --help` output, and release notes into the builder's own vocabulary.
    local_owners:
      - knowledge/store/app-store-connect-cli.md
      - catalog/knowledge/store/store-app-store-connect-cli.yaml
      - knowledge/store/app-review-observe.md
      - knowledge/store/app-review-remediate.md
      - knowledge/store/app-review-resubmit.md
    tests:
      - checks/validation/business/store/check-asc-command-contract.ts
    upstream_paths:
      - README.md
    pin_authority: knowledge manifest last_review_date and the reviewed baselines below
baselines:
  reviewed_source:
    revision: "3f0b4993ae2dce8601ffe02bb5b6d1b36a2f5564"
    observed_at: "2026-10-08"
    by: b2c-maintainers
    note: Tag 5.13.0 commit. Local Linux amd64 --help on 2026-10-08. Checksum 7e43e453495c0d49ba8a93953fcf4d3a51c0b4593c00af6e8c53b243350a5db9. No App Store Connect API call. The exact 5.1.0 JSON samples remain historical.
  reviewed_guidance:
    revision: "5.13.0"
    observed_at: "2026-10-08"
    by: b2c-maintainers
    note: "Per-revision guidance through 5.13.0. 5.8.0 adds screenshot framing and web apps create --if-exists; no cookbook command change. 5.8.1 is a status and builds fix. 5.9.0 blocks validate on a missing base-territory price and on missing iPad screenshots when --ipa shows iPad. 5.9.1 and 5.9.2 are auth and web fixes. 5.10.0 adds status --until, StoreKit reads, and IAP or subscription localization import. 5.11.0 is recovery and classification fixes; no new cookbook command. 5.12.0 adds Asset Library reads, creative image upload, header and search placements, iPhone Duo screenshots and previews, and product page optimization v2. 5.12.1 stops polling failed library images. 5.13.0 adds reusable video upload, image and video lifecycle, reuse across custom product pages and In-App Events, and OpenAPI 4.5.1 list filters. This is not a workspace pin; inspect does not upgrade the host, and `b2c doctor` is a supported equivalent for observing the version."
support:
  policy: Executable guidance is stored per exact reviewed revision. Any other installed version re-verifies each command with `asc <cmd> --help` before first use (Verified Command Cookbook rule). A passing live probe proves the probed tokens on the probed binary only, never a version range. Support is `>= 5.0.0 < 6.0.0`. Major versions below 5 are unsupported. Web-login handoff is refused unless the winning binary is `>= 5.1.0`.
  versions:
    - range: ">=5.0.0 <6.0.0"
      status: supported
      evidence:
        - knowledge/store/app-store-connect-cli.md Verified Command Cookbook (local --help, 2026-10-08)
        - GitHub releases 5.0.0 through 5.7.0, plus 5.8.0 (2026-09-29), 5.8.1 (2026-09-30), 5.9.0 (2026-10-01), 5.9.1 (2026-10-01), 5.9.2 (2026-10-03), 5.10.0 (2026-10-04), 5.11.0 (2026-10-05), 5.12.0 (2026-10-06), 5.12.1 (2026-10-06), and 5.13.0 (2026-10-07)
    - range: "<5.0.0"
      status: unsupported
      evidence:
        - check-asc-command-contract.ts warns asc_command_contract.live_cli_stale
  operations:
    - id: asc.auth.status
      title: asc auth status --validate / asc auth doctor
      keywords: [auth, login, keychain, profile]
      owners: [knowledge/store/app-store-connect-cli.md]
    - id: asc.apps.view
      title: asc apps list / asc apps view --id
      keywords: [apps]
      owners: [checks/validation/business/store/check-asc-command-contract.ts]
    - id: asc.status
      title: asc status --app
      keywords: [status]
      owners: [checks/validation/business/store/check-asc-command-contract.ts]
    - id: asc.review.status
      title: asc review status / doctor / submissions-list
      keywords: [review, submission]
      owners: [adapters/app-review/asc-provider.ts, catalog/providers/apple-asc.yaml]
    - id: asc.metadata.validate
      title: asc metadata pull / validate / push --dry-run
      keywords: [metadata, localizations]
      owners: [catalog/providers/apple-asc.yaml]
    - id: asc.web.agreements.status
      title: asc web agreements status (observe only)
      keywords: [agreements]
      owners: [catalog/providers/apple-asc.yaml, adapters/app-review/mandate.ts]
    - id: asc.web.review.show
      title: asc web auth status / asc web review list / show
      keywords: [web auth, web review, web-session]
      owners: [adapters/app-review/asc-provider.ts]
    - id: asc.screenshots.validate
      title: asc screenshots sizes / validate; deprecated screenshot upload after founder approval
      keywords: [screenshot, screenshots]
      owners: [knowledge/store/app-store-connect-cli.md]
    - id: asc.asset-library
      title: asc asset-library view, list, upload, and lifecycle
      keywords: [asset-library, asset library]
      owners: [knowledge/store/app-store-connect-cli.md]
    - id: asc.placements
      title: asc localizations placements list and create; custom page and event reuse
      keywords: [placements, placement]
      owners: [knowledge/store/app-store-connect-cli.md]
    - id: asc.product-pages.v2
      title: asc product-pages experiments create --v2 and treatments create --v2
      keywords: [product-pages, experiments, treatments]
      owners: [knowledge/store/app-store-connect-cli.md]
    - id: asc.status.until
      title: asc status --until
      keywords: [status, until]
      owners: [knowledge/store/app-store-connect-cli.md]
    - id: asc.storekit.read
      title: asc storekit transactions history and subscriptions status
      keywords: [storekit]
      owners: [knowledge/store/app-store-connect-cli.md]
    - id: asc.localizations.import
      title: asc iap and subscriptions versions localizations import --dry-run
      keywords: [localizations, import]
      owners: [knowledge/store/app-store-connect-cli.md]
    - id: asc.screenshots.list
      title: asc screenshots list (read-only; one locale or every version localization)
      keywords: [screenshot, screenshots, localization]
      owners: [knowledge/store/app-store-connect-cli.md]
    - id: asc.diff.localizations
      title: asc diff localizations
      keywords: [diff, localizations]
      owners: [checks/validation/business/store/check-asc-command-contract.ts]
    - id: asc.age-rating.audit
      title: asc age-rating audit
      keywords: [age-rating, age rating]
      owners: [knowledge/store/age-rating-questionnaire.md]
    - id: asc.optimize.keywords
      title: asc optimize keywords rank / discover / score
      keywords: [optimize, keyword]
      owners: [knowledge/store/aso-apple-keyword-evidence.md]
    - id: asc.subscriptions.pricing.derive
      title: asc subscriptions pricing derive --dry-run
      keywords: [subscriptions, pricing]
      owners: [knowledge/money/subscription-price-derivation.md]
    - id: asc.telemetry.status
      title: asc telemetry status
      keywords: [telemetry]
      owners: [knowledge/store/app-store-connect-cli.md]
    - id: asc.testflight.read
      title: asc testflight feedback list / crashes list
      keywords: [testflight, tester, crash]
      owners: [knowledge/store/app-store-connect-cli.md]
    - id: asc.validate
      title: asc validate --app --version|--version-id
      keywords: [validate]
      owners: [checks/validation/business/store/check-asc-command-contract.ts]
    - id: asc.webhooks.read
      title: asc webhooks list / view / ping / deliveries
      keywords: [webhook, webhooks]
      owners: [adapters/app-review/capability.ts]
    - id: asc.install-skills
      title: asc install-skills (founder-approved; pinned skill pack)
      keywords: [install-skills, skills]
      owners: [knowledge/store/app-store-connect-cli.md]
  unsupported_operations:
    - id: asc.web.agreements.accept
      reason: Account Holder action. Never run from an App Review observe mandate; interactive founder confirmation and provider readback are required.
    - id: asc.webhooks.serve
      reason: Fixture-only. Production ingress goes through `b2c app-review-ingress`; --allow-remote and --exec on a public bind are refused.
    - id: asc.apps.get
      reason: Known-invalid command form. check:asc-command-contract fails closed when it appears in stored guidance.
    - id: asc.apps.view.app
      reason: Known-invalid 5.x form. Use `asc apps view --id`. check:asc-command-contract fails closed when `asc apps view --app` appears in stored guidance.
    - id: asc.validate.app-store-version
      reason: Known-invalid subcommand form. Use --version or --version-id with --app.
  platforms:
    - macOS arm64 (observed host)
    - macOS amd64, Linux amd64/arm64, Windows amd64 (release assets exist; not exercised by the builder)
adaptations:
  - id: forbidden-command-forms
    description: Stored guidance must not contain `asc apps get`, `asc apps view --app`, or `asc validate app-store-version`; the contract check fails closed when any appear.
    owner: checks/validation/business/store/check-asc-command-contract.ts
    intentional: true
  - id: session-from-env-flag-only
    description: "The --session-from-env flag may appear as a flag name. Session cookie or env values are never stored in knowledge, observations, receipts, or evals."
    owner: knowledge/store/app-store-connect-cli.md
    intentional: true
  - id: observe-mandate-refusals
    description: The App Review observe mandate refuses submit, cancel, agreement acceptance, and webhook serving regardless of what the CLI allows.
    owner: adapters/app-review/mandate.ts
    intentional: true
  - id: confirm-plus-founder-gate
    description: Mutating commands need both the CLI `--confirm` flag and explicit founder approval; omitting `--confirm` is an error, not a dry run.
    owner: knowledge/store/app-store-connect-cli.md
    intentional: true
  - id: never-source-credential-env
    description: Credential env files are never sourced; profiles or extracted single values are used instead.
    owner: knowledge/store/app-store-connect-cli.md
    intentional: true
  - id: telemetry-disclosure
    description: The `asc telemetry status` output is recorded as evidence because the CLI sends pseudonymous usage telemetry by default.
    owner: knowledge/store/app-store-connect-cli.md
    intentional: true
  - id: skill-pack-subordinate
    description: Skill pack guidance is subordinate reference material routed by name; no upstream SKILL.md becomes a top-level builder skill.
    owner: knowledge/store/app-store-connect-cli.md
    intentional: true
host_probe:
  command: asc
  args: ["--version"]
  version_pattern: "^(\\d+\\.\\d+\\.\\d+)"
review:
  owner: b2c-maintainers
  cadence_days: 7
  last_review: "2026-10-08"
  status: current
credits:
  acknowledge: true
  use: direct
  summary: Automates App Store Connect reads, validation, dry runs, and founder-gated store actions through the installed asc executable. The builder adapts its command procedures and refuses the commands it does not support.
