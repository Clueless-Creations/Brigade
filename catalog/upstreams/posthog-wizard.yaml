    intentional: true
  - id: separate-source-disclosure
    description: Require source-upload and agent-execution approval separately from telemetry settings. No telemetry flag or secret scanner is proof that all source disclosure is disabled.
    owner: knowledge/data/posthog-agent-tooling.md
    intentional: true
