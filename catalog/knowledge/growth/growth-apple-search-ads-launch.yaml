applicability_notes: Reauthored from one self-reported indie setup. Figures from that account are one
  anecdote and are not targets. Apple's current ad policies outrank the anecdote. Spend needs founder
  approval and a daily cap. Competitor names may be keywords. Ad copy and custom product pages stay
  modelled on the category, using this app's own claims and screenshots.
