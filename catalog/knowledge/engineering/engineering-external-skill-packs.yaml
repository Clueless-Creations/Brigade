schema_version: 1.0.0
id: reference.engineering.external-skill-packs
title: External Skill Packs
domain_id: domain.engineering
document_path: knowledge/engineering/external-skill-packs.md
load_when: a launch routes work to an installed third-party skill pack (marketing, writing, GEO/SEO, product management,
  legal templates, design tooling, design taste, layered product method) and the dispatcher must know which role may
  load it, in which mode, and with which boundary
lifecycle: active
bindings:
  workflow_ids:
    - workflow.orchestration.full-launch-program
    - workflow.engineering.app-agent-roster-and-repo-entrypoints
    - workflow.research.spec-red-team-audit
    - workflow.design.reference-pack-librarian
    - workflow.design.design-system-audit
    - workflow.growth.landing-funnel-audit
    - workflow.words.copy-review-audit
  context_pack_ids:
    - context.orchestration
applicability_notes: A skill pack never marks a lane done. The B2C reference that already adapts a pack wins on conflict.
  Skill names are installed directory names; verify the installed set with the runtime's skill listing before dispatch.
  Packs that write PRODUCT.md, DESIGN.md, or reducer state are restricted to the commands that do not.
