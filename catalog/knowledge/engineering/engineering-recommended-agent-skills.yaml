schema_version: 1.0.0
id: reference.engineering.recommended-agent-skills
title: Recommended Agent Skills
domain_id: domain.engineering
document_path: knowledge/engineering/recommended-agent-skills.md
load_when: before Expo or SwiftUI implementation when choosing recommended external agent skill packs
  for craft, motion, store work, optional recency research, or optional design-research provider guidance without
  vendor lock-in
lifecycle: active
bindings:
  workflow_ids:
    - workflow.engineering.engineering-orchestration-ce-production-readiness
    - workflow.store.aso-and-store-ops
    - workflow.design.premium-mobile-craft
  context_pack_ids:
    - context.engineering
    - context.design
applicability_notes: Stack-specific packs apply only when the selected stack matches. Expo, Emil, Appllama,
  SwiftUI Pro, and Vercel packs are never Flutter prescriptions. last30days is an opt-in host engine for scored
  recency briefs; it is not a default and does not replace AppKittie, XPOZ, or Firecrawl. Keep paid/vendor MCPs
  off the default surface.
