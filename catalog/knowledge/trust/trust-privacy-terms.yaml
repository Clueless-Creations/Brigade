schema_version: 1.0.0
id: reference.trust.privacy-terms
title: Privacy Terms
domain_id: domain.trust
document_path: knowledge/trust/privacy-terms.md
load_when: before drafting or publishing privacy policy, terms, EULA, subscription terms, account/data deletion flows,
  or app-store privacy/Data safety disclosures
lifecycle: active
bindings:
  workflow_ids:
    - workflow.trust.security-architecture-and-release-gate
    - workflow.trust.privacy-and-terms
    - workflow.store.apple-app-store-requirements-privacy-manifest
    - workflow.store.google-play-release
    - workflow.engineering.backend-data-contract
  context_pack_ids:
    - context.trust
sources:
  - id: developer-apple-com-app-store-app-privacy-details
    name: Apple App Privacy Details
    source_type: official_docs
    url: https://developer.apple.com/app-store/app-privacy-details
    review_cadence_days: 7
    claim_scope: Location resolution and immediate coarsening, request-only non-retention, diagnostic type/purpose, linkage and tracking definitions, and label updates without an app update. Serialization precision is a Brigade engineering inference, not Apple wording.
    last_review_date: 2026-10-03
    reviewer: b2c-maintainers
  - id: developer-apple-com-help-app-store-connect-manage-app-information-manage-app-pri
    name: Apple Manage app privacy
    source_type: official_docs
    url: https://developer.apple.com/help/app-store-connect/manage-app-information/manage-app-privacy
    review_cadence_days: 7
    claim_scope: Published responses describe collection from the currently available app version and must stay accurate as data practices change. Backend and binary sequencing is Brigade operational interpretation.
    last_review_date: 2026-10-03
    reviewer: b2c-maintainers
  - id: developer-apple-com-documentation-bundleresources-describing-data-use-in-privac
    name: Apple Describing data use in privacy manifests
    source_type: official_docs
    url: https://developer.apple.com/documentation/bundleresources/describing-data-use-in-privacy-manifests
    review_cadence_days: 7
    claim_scope: Separate app and linked SDK collection declarations and archive privacy report aggregation; checked through Apple's public documentation JSON.
    last_review_date: 2026-10-03
    reviewer: b2c-maintainers
  - id: general-legal-template-collection
    name: General Legal template collection
    source_type: attorney_template_repository
    url: https://github.com/General-Legal/legal-templates
    review_cadence_days: 30
    claim_scope: Optional CC0 drafting benchmark for privacy policies, terms, cookie notices, and data-processing addenda. It is not legal authority.
    last_review_date: 2026-08-20
    reviewer: b2c-maintainers
