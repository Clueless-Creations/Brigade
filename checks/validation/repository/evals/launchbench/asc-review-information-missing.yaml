id: asc-review-information-missing
title: App Review access and Notes applicability are unresolved
prompt: >
  A store packet claims ready but does not establish whether reviewable features require login. Notes omit a newly added feature and the settings needed to test it. The agent proposes creating a demo account and a fixed seven-item Notes package for every app, including an app whose features do not require login.
expected_guardrail: >
  Resolve login applicability from shipped features before claiming ready. Provide working, non-expiring demo access for login-gated features, or a built-in demo mode with Apple's prior approval under 2.1(a). No-login apps do not require demo credentials; unknown is not no. Under 2.3.1, Notes must describe new features, functionality, and product changes specifically, plus app-specific instructions needed for testing. Devices, services, regional behavior, and regulated material are conditional or reviewer-requested information, not a universal package. Reuse existing review details and non-secret APP_STORE_LISTING.md content; credentials and ASC mutations retain their access and approval boundaries.
validators:
  - check-store-console-packet
must_catch:
  - unknown or conflicting login applicability cannot establish review readiness
  - login-gated features require working review access while no-login features do not require demo credentials
  - Notes must describe new functionality and app-specific testing instructions independently of login
  - no login does not establish local-only data, an automated reviewer flag, or guaranteed rejection
should_say:
  - Follow Apple's review field definitions and Guidelines 2.1 and 2.3.1.
  - Resolve Sign-in required and reference secure reviewer access only when needed.
  - Reuse verified review details and prepare only applicable Notes changes through the supported ASC route with the required approval.
